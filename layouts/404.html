{{ define "main" }}
  <h1 class="mb-3 text-4xl font-extrabold">{{ i18n "error.404_title" | emojify }}</h1>
  <p class="mt-8 mb-12 text-neutral-400 dark:text-neutral-500">
    {{ i18n "error.404_error" | emojify }}
  </p>
  <div class="prose dark:prose-invert">
    <p>{{ i18n "error.404_description" | emojify }}</p>
  </div>
  {{/* Report the missing path and referrer to Fathom as a custom event,
       so 404 traffic shows what was actually requested. */}}
  <script>
    window.addEventListener("load", function () {
      if (!window.fathom || typeof window.fathom.trackEvent !== "function") return;
      var path = window.location.pathname + window.location.search;
      var ref = document.referrer || "none";
      window.fathom.trackEvent(("404 " + path + " | ref " + ref).slice(0, 250));
    });
  </script>
{{ end }}
